name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build
