<text x="50" y="142" font-size="14" font-weight="400" fill="#66778b">Университет · осень 2026  /  Расчёт</text><rect x="160" y="181" width="960" height="474" rx="8" fill="#ffffff" stroke="none"/><text x="204" y="236" font-size="23" font-weight="700" fill="#102b4e">Поиск оптимального расписания</text><text x="204" y="271" font-size="15" font-weight="400" fill="#66778b">Система проверяет ограничения и подбирает допустимые варианты.</text><rect x="204" y="307" width="146" height="34" rx="17" fill="#e9f6f1" stroke="none"/><text x="224" y="329" font-size="14" font-weight="600" fill="#1d8a70">● Выполняется</text><text x="204" y="393" font-size="15" font-weight="600" fill="#243447">Прогресс расчёта</text><text x="1015" y="393" font-size="20" font-weight="700" fill="#1565c0">63%</text><rect x="204" y="418" width="872" height="18" rx="9" fill="#e5edf5" stroke="none"/><rect x="204" y="418" width="549" height="18" rx="9" fill="#1565c0" stroke="none"/><rect x="204" y="477" width="872" height="84" rx="9" fill="#f7f9fd" stroke="none"/><text x="226" y="511" font-size="14" font-weight="400" fill="#66778b">Текущее состояние</text><text x="226" y="537" font-size="15" font-weight="600" fill="#243447">Выполняется оптимизация расписания по выбранным критериям</text><rect x="910" y="585" width="166" height="38" rx="7" fill="#ffffff" stroke="#dce4ed"/><text x="925" y="610" font-size="14" font-weight="600" fill="#1565c0">Отменить</text><text x="204" y="614" font-size="13" font-weight="400" fill="#66778b">Отмена не затронет ранее сохранённые расписания.</text><text x="178" y="715" font-size="15" font-weight="400" fill="#66778b">После завершения можно открыть найденные варианты и сравнить результаты.</text>
